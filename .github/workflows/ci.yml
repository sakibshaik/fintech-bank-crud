name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # npm ci also runs the postinstall hook, which runs `prisma generate`.
      - run: npm ci

      - run: npm test

      - run: npm run typecheck
